<script>
const $=id=>document.getElementById(id),fmt=n=>"$"+Math.round(n).toLocaleString("es-AR");
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const hoy=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const PRECIO=15000,K="cpp_v2";
let ME=null,US=null,NAMES={},ADMIN=true,DB=null,LAST={},SQ=Promise.resolve();let S={carteras:[],clientes:[],cobros:{},pagos:[]},sel="TODAS",tab="inicio";
const TABS=[["inicio","🏠 Inicio"],["cobranzas","💵 Cobranzas"],["carteras","👛 Carteras"],["clientes","👥 Clientes"],["credito","➕ Nuevo crédito"],["caja","🏦 Caja"],["capital","💼 Capital"],["historial","🧾 Historial"],["reportes","📊 Reportes"],["planes","✨ Planes"]];
function load(){try{const r=localStorage.getItem(K);if(r){S=JSON.parse(r);return}}catch(e){}
 S.carteras=[{id:"k1",nombre:"Centro",cobrador:"Juan Pérez",zona:"Zárate Centro",color:"#059669"},{id:"k2",nombre:"Ruta Sur",cobrador:"Marcos Díaz",zona:"Campana",color:"#1e40af"}];
 const c=(id,n,t,d,k,cu,ac,to,m,i)=>({id,nombre:n,tel:t,dir:d,carteraId:k,cuota:cu,actual:ac,total:to,monto:m,interes:i,estado:"AL_DIA",fecha:"2026-08-01"});
 S.clientes=[c("a1","Mariana Costa","5493487112233","Av. Anta 450","k1",2500,3,10,20000,25),c("a2","Roberto Gauna","5493487223344","Justa Lima 820","k1",3000,5,8,20000,20),c("a3","Lucía Fernández","5493487445566","Lavalle 1200","k1",4000,10,10,30000,33),
 c("a4","Esteban Ríos","5493487556677","Ruta 9 Km 84","k2",5000,2,12,50000,20),c("a5","Sofía Martínez","5493487667788","Siderca Casa 40","k2",3500,6,10,28000,25)];
 S.clientes[2].estado="PAGADO";S.clientes[4].estado="ATRASADO";save()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(DB)SQ=SQ.then(remote).catch(e=>console.error(e))}
function logA(a,d){S.auditoria.push({id:"a"+Date.now()+Math.random().toString(36).slice(2,5),ts:new Date().toISOString().slice(0,16).replace("T"," "),por:ME,accion:a,detalle:d})}
async function resolve(){if(!US)return;const ids=new Set();["pagos","gastos","capital","cierres","clientes","auditoria"].forEach(k=>S[k].forEach(x=>{if(x.por)ids.add(x.por)}));
 const need=[...ids].filter(i=>!(i in NAMES));if(!need.length)return;
 try{const ps=await US.profiles(need);need.forEach(i=>{const q=ps[i]||{};NAMES[i]=(q.name||"Socio")+(q.isMe?" (vos)":"")});if(!busy())render()}catch(e){}}
async function remote(){
 for(const c of["carteras","clientes","pagos","gastos","cierres","capital","auditoria"]){const cur={};
  S[c].forEach(x=>{x.id=x.id||c[0]+Date.now()+Math.random().toString(36).slice(2,6);cur[x.id]=JSON.stringify(x)});
  for(const id in cur)if(LAST[c+id]!==cur[id]){LAST[c+id]=cur[id];await DB.doc(c+"/"+id).set(JSON.parse(cur[id]))}
  for(const k of Object.keys(LAST))if(k.startsWith(c)&&!(k.slice(c.length) in cur)){delete LAST[k];await DB.doc(c+"/"+k.slice(c.length)).delete()}}
 for(const f in S.cobros){const j=JSON.stringify(S.cobros[f]);if(LAST["cb"+f]!==j){LAST["cb"+f]=j;await DB.doc("cobros/"+f).set({m:S.cobros[f]})}}}
function ask(msg,def){return new Promise(res=>{$("mbox").innerHTML=`<p class="mb-2 text-sm">${esc(msg)}</p><input id="askv" value="${esc(def??"")}" class="${inp}"><div class="text-right mt-3"><button id="ka" class="px-3 py-2 border rounded-lg text-sm">Cancelar</button> <button id="ko" class="px-3 py-2 bg-blue-800 text-white rounded-lg text-sm">Aceptar</button></div>`;$("modal").classList.remove("hide");$("ko").onclick=()=>{const v=$("askv").value;cerrar();res(v)};$("ka").onclick=()=>{cerrar();res(null)};$("askv").focus()})}
function toast(t){const d=document.createElement("div");d.textContent=t;d.className="fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2 rounded-lg text-sm z-50";document.body.appendChild(d);setTimeout(()=>d.remove(),2500)}
function busy(){return !$("modal").classList.contains("hide")||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)}
async function initDb(){try{const cl=window.claude;if(!cl)return;const db=await cl.use("db");if(!db)return;const us=await cl.use("user");ADMIN=true;US=us;ME=us?(await us.me()).id:null;
 DB=db;S={carteras:[],clientes:[],pagos:[],gastos:[],cierres:[],capital:[],auditoria:[],cobros:{}};LAST={};render();
 ["carteras","clientes","pagos","gastos","cierres","capital","auditoria"].forEach(c=>db.collection(c).onSnapshot(q=>{
  Object.keys(LAST).forEach(k=>{if(k.startsWith(c))delete LAST[k]});

 return `<div class="bg-white rounded-xl border p-5 text-sm space-y-3"><h2 class="font-bold text-lg">Plan START vs PRO</h2>`+tbl(["Función","START (celular)","PRO (grupal)"],[["Dispositivo","Celular","PC / escritorio"],["Carteras","1","Múltiples"],["Costo","Fijo individual","1ra gratis + $15.000 c/extra"],["Caja","Simple","Por cartera + consolidada"],["Cobradores","No","1 por cartera"]].map(r=>`<tr>${r.map(x=>`<td class="px-3 py-2">${x}</td>`).join("")}</tr>`).join(""))+`<div>Carteras: <b>${S.carteras.length}</b> · Extras: <b>${p} × $15.000</b> · Total: <b class="text-blue-900">${fmt(p*PRECIO)}/mes</b></div></div>`}
};
async function marcar(id,e){let c=S.clientes.find(x=>x.id===id);
 if(e==="COBRADO"){const m=parseFloat(await ask("Monto cobrado a "+c.nombre+" (cuota "+fmt(c.cuota)+")",c.cuota));if(!(m>0))return;c=S.clientes.find(x=>x.id===id);
  c.parcial=(c.parcial||0)+m;while(c.parcial>=c.cuota&&c.actual<c.total){c.parcial-=c.cuota;c.actual++}
  S.pagos.push({por:ME,id:"p"+Date.now()+Math.random().toString(36).slice(2,6),fecha:hoy(),clienteId:id,cliente:c.nombre,carteraId:c.carteraId,monto:m});if(c.actual>=c.total){c.estado="PAGADO";c.parcial=0}}
 hp()[id]=e;save();render()}
function csvBox(t,rows){const x=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");
 $("mbox").innerHTML=`<h3 class="font-bold mb-2">${t}</h3><p class="text-xs text-slate-500 mb-2">Copiá y pegá en Excel o Google Sheets.</p><textarea readonly onfocus="this.select()" class="w-full h-56 border rounded p-2 text-xs font-mono">${esc(x)}</textarea><div class="text-right mt-2"><button onclick="cerrar()" class="px-3 py-2 bg-slate-800 text-white rounded-lg text-sm">Cerrar</button></div>`;$("modal").classList.remove("hide")}
function expPagos(){csvBox("Pagos",[["Fecha","Cliente","Cartera","Monto"],...S.pagos.map(p=>[p.fecha,p.cliente||"",cart(p.carteraId).nombre,p.monto])])}
function expTodo(){const q=i=>NAMES[i]||"",R=[];const sec=(t,h,a)=>{R.push(["== "+t+" =="],h,...a,[""])};
 sec("CARTERAS",["Nombre","Cobrador","Zona"],S.carteras.map(c=>[c.nombre,c.cobrador,c.zona]));
 sec("CLIENTES",["Nombre","Teléfono","Dirección","Cartera","Estado","Frecuencia","Cuotas pagadas","Total cuotas","Valor cuota","Capital","Interés %","Fecha alta","Alta por"],S.clientes.map(c=>[c.nombre,c.tel,c.dir,cart(c.carteraId).nombre,c.estado,c.frec||"Semanal",c.actual,c.total,c.cuota,c.monto,c.interes,c.fecha,q(c.por)]));
 sec("PAGOS",["Fecha","Cliente","Cartera","Monto","Registró"],S.pagos.map(p=>[p.fecha,p.cliente||"",cart(p.carteraId).nombre,p.monto,q(p.por)]));
 sec("GASTOS",["Fecha","Concepto","Cartera","Monto","Registró"],S.gastos.map(g=>[g.fecha,g.concepto,cart(g.carteraId).nombre,g.monto,q(g.por)]));
 sec("CAPITAL",["Fecha","Tipo","Socio","Monto","Nota","Registró"],S.capital.map(m=>[m.fecha,m.tipo,m.socio,m.monto,m.nota||"",q(m.por)]));
 sec("CIERRES DE CAJA",["Fecha","Esperado","Contado","Diferencia","Registró"],S.cierres.map(c=>[c.fecha,c.esperado,c.contado,c.dif,q(c.por)]));
 sec("AUDITORIA",["Fecha","Quién","Acción","Detalle"],S.auditoria.map(a=>[a.ts,q(a.por),a.accion,a.detalle||""]));
 csvBox("Respaldo completo "+hoy(),R)}
function expClientes(){csvBox("Clientes",[["Nombre","Teléfono","Dirección","Cartera","Estado","Cuotas pagadas","Total cuotas","Valor cuota","Capital","Interés %"],...S.clientes.map(c=>[c.nombre,c.tel,c.dir,cart(c.carteraId).nombre,c.estado,c.actual,c.total,c.cuota,c.monto,c.interes])])}
function cerrarCaja(e,esp){e.preventDefault();const c=+$("cont").value;S.cierres.unshift({por:ME,fecha:hoy(),esperado:esp,contado:c,dif:c-esp});save();render()}
function ficha(id){const c=S.clientes.find(x=>x.id===id),d=DIAS[c.frec||"Semanal"],h=hoy();let rows="";
 for(let n=1;n<=c.total;n++){const v=addD(c.fecha,n*d),st=n<=c.actual?"✅ Pagada":v<=h?"⚠️ Vencida":"Pendiente";rows+=`<tr class="border-b"><td class="py-1">${n}</td><td>${v}</td><td>${fmt(c.cuota)}</td><td>${st}</td></tr>`}
 $("mbox").innerHTML=`<h3 class="font-bold text-lg">${esc(c.nombre)}</h3><div class="text-xs text-slate-500 mb-2">${esc(c.dir)} · ${esc(c.tel)} · ${c.frec||"Semanal"} · Alta: ${qn(c.por)}</div><div class="grid grid-cols-2 gap-2 text-sm mb-2"><div>Saldo: <b>${fmt(saldoDe(c))}</b></div><div>Pago parcial: <b>${fmt(c.parcial||0)}</b></div></div><div class="max-h-52 overflow-y-auto border rounded p-2 text-xs"><table class="w-full text-left"><tr class="font-bold"><td>N°</td><td>Vence</td><td>Cuota</td><td>Estado</td></tr>${rows}</table></div><div class="flex flex-wrap gap-2 mt-3 justify-end"><button onclick="editCli('${id}')" class="px-3 py-2 bg-slate-700 text-white rounded-lg text-sm font-semibold">Editar</button><button onclick="delCli('${id}')" class="px-3 py-2 bg-rose-600 text-white rounded-lg text-sm font-semibold">Eliminar</button><button onclick="refin('${id}')" class="px-3 py-2 bg-amber-500 text-white rounded-lg text-sm font-semibold">Refinanciar</button><button onclick="cerrar()" class="px-3 py-2 border rounded-lg text-sm">Cerrar</button></div>`;$("modal").classList.remove("hide")}
async function refin(id){let c=S.clientes.find(x=>x.id===id);const d=DIAS[c.frec||"Semanal"],sa=saldoDe(c);
 const n=parseInt(await ask("Saldo "+fmt(sa)+". Nueva cantidad de cuotas",6));if(!(n>0))return;const i=parseFloat(await ask("Interés % sobre el saldo",10));if(isNaN(i))return;
 c=S.clientes.find(x=>x.id===id);logA("Refinanciación",c.nombre+" · "+n+" cuotas");c.cuota=Math.round(sa*(1+i/100)/n);c.total=c.actual+n;c.parcial=0;c.fecha=addD(hoy(),-c.actual*d);c.estado="AL_DIA";save();cerrar();render()}
function addGasto(e){e.preventDefault();S.gastos.push({por:ME,fecha:hoy(),carteraId:sel==="TODAS"?(S.carteras[0]||{}).id:sel,concepto:$("gc").value.trim(),monto:+$("gm").value});save();render()}
function editCli(id){const c=S.clientes.find(x=>x.id===id);
 $("mbox").innerHTML=`<form onsubmit="gCli(event,'${id}')" class="space-y-3"><h3 class="font-bold text-lg">Editar cliente</h3><input id="en" required value="${esc(c.nombre)}" class="${inp}"><input id="et" required pattern="[0-9]{8,15}" value="${esc(c.tel)}" class="${inp}"><input id="ed" required value="${esc(c.dir)}" class="${inp}"><select id="ek" class="${inp}">${S.carteras.map(k=>`<option value="${k.id}" ${k.id===c.carteraId?"selected":""}>${esc(k.nombre)}</option>`).join("")}</select><label class="text-xs font-bold">Valor de cuota</label><input id="eq" type="number" min="1" required value="${c.cuota}" class="${inp}"><div class="text-right"><button type="button" onclick="cerrar()" class="px-3 py-2 border rounded-lg text-sm">Cancelar</button> <button class="px-3 py-2 bg-blue-800 text-white rounded-lg text-sm">Guardar</button></div></form>`}
function gCli(e,id){e.preventDefault();logA("Cliente editado",$("en").value.trim());Object.assign(S.clientes.find(x=>x.id===id),{nombre:$("en").value.trim(),tel:$("et").value.trim(),dir:$("ed").value.trim(),carteraId:$("ek").value,cuota:+$("eq").value});save();cerrar();render();toast("Cliente actualizado")}
async function delCli(id){const c=S.clientes.find(x=>x.id===id);if(null===await ask("¿Eliminar a "+c.nombre+"? Se borra su crédito (el historial de pagos se conserva). Aceptá para confirmar.",""))return;
 logA("Cliente eliminado",c.nombre);S.clientes=S.clientes.filter(x=>x.id!==id);save();render();toast("Cliente eliminado")}
async function anular(pid){const p=S.pagos.find(x=>x.id===pid);if(!p)return;
 if(null===await ask("¿Anular el pago de "+fmt(p.monto)+" de "+(p.cliente||"")+"? Se revierte la cuota. Aceptá para confirmar.",""))return;
 const c=S.clientes.find(x=>x.id===p.clienteId);
 if(c){c.parcial=(c.parcial||0)-p.monto;while(c.parcial<0&&c.actual>0){c.actual--;c.parcial+=c.cuota}c.parcial=Math.max(0,c.parcial)}
 logA("Pago anulado",fmt(p.monto)+" · "+(p.cliente||""));S.pagos=S.pagos.filter(x=>x.id!==pid);
 if(!S.pagos.some(x=>x.fecha===p.fecha&&x.clienteId===p.clienteId)&&S.cobros[p.fecha])delete S.cobros[p.fecha][p.clienteId];
 save();render();toast("Pago anulado")}
function addCap(e){e.preventDefault();S.capital.push({por:ME,id:"m"+Date.now()+Math.random().toString(36).slice(2,6),fecha:hoy(),tipo:$("mt").value,socio:$("ms").value.trim(),monto:+$("mm").value,nota:$("mn").value.trim()});save();render();toast("Movimiento registrado")}
async function delCap(id){if(null===await ask("¿Eliminar este movimiento de capital? Aceptá para confirmar.",""))return;{const m0=S.capital.find(m=>m.id===id);logA("Capital eliminado",m0?m0.tipo+" "+fmt(m0.monto)+" · "+m0.socio:"")}S.capital=S.capital.filter(m=>m.id!==id);save();render()}
function setEstado(id,e){S.clientes.find(c=>c.id===id).estado=e;save();render()}
function sim(){const m=+$("m").value||0,i=+$("i").value||0,c=+$("c").value||1,t=m*(1+i/100);$("sim").innerHTML=`Total a devolver: <b>${fmt(t)}</b><br>Cada cuota: <b class="text-emerald-700 text-lg">${fmt(t/c)}</b><br>Ganancia proyectada: <b>${fmt(t-m)}</b>`}
function nuevoCredito(e){e.preventDefault();const m=+$("m").value,i=+$("i").value,c=+$("c").value;
 S.clientes.push({id:"c"+Date.now(),nombre:$("n").value.trim(),tel:$("t").value.trim(),dir:$("d").value.trim(),carteraId:$("k").value,cuota:Math.round(m*(1+i/100)/c),actual:0,total:c,monto:m,interes:i,estado:"AL_DIA",fecha:hoy(),frec:$("f").value,por:ME});
 save();tab="cobranzas";render();toast("✅ Crédito emitido")}
function mCartera(id){const c=S.carteras.find(x=>x.id===id)||{nombre:"",cobrador:"",zona:"",color:"#1e40af"};
 $("mbox").innerHTML=`<form onsubmit="gCartera(event,'${id||""}')" class="space-y-3"><h3 class="font-bold text-lg">${id?"Editar":"Nueva"} cartera</h3><input id="cn" required placeholder="Nombre" value="${esc(c.nombre)}" class="${inp}"><input id="cc" required placeholder="Cobrador" value="${esc(c.cobrador)}" class="${inp}"><input id="cz" required placeholder="Zona / ciudad" value="${esc(c.zona)}" class="${inp}"><input id="cl" type="color" value="${c.color}" class="w-full h-10"><p class="text-xs bg-amber-50 border border-amber-200 rounded p-2">La primera cartera es gratis. Las adicionales cuestan $15.000/mes.</p><div class="text-right"><button type="button" onclick="cerrar()" class="px-3 py-2 border rounded-lg text-sm">Cancelar</button> <button class="px-3 py-2 bg-blue-800 text-white rounded-lg text-sm">Guardar</button></div></form>`;$("modal").classList.remove("hide")}
function cerrar(){$("modal").classList.add("hide")}
function gCartera(e,id){e.preventDefault();const d={nombre:$("cn").value.trim(),cobrador:$("cc").value.trim(),zona:$("cz").value.trim(),color:$("cl").value};
 if(id)Object.assign(S.carteras.find(x=>x.id===id),d);else S.carteras.push({id:"k"+Date.now(),...d});save();cerrar();render()}
async function delCartera(id){const n=S.clientes.filter(c=>c.carteraId===id).length,dest=S.carteras[0].id;
 if(null===await ask(`¿Eliminar cartera? Sus ${n} clientes pasarán a "${S.carteras[0].nombre}".`,""))return;
 S.clientes.forEach(c=>{if(c.carteraId===id)c.carteraId=dest});S.pagos.forEach(p=>{if(p.carteraId===id)p.carteraId=dest});
 logA("Cartera eliminada",cart(id).nombre);S.carteras=S.carteras.filter(c=>c.id!==id);save();render()}
initDb();load();S.cierres=S.cierres||[];S.gastos=S.gastos||[];S.capital=S.capital||[];S.auditoria=S.auditoria||[];render();

  });

</script></body></html>
